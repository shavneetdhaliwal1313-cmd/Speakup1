<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakUp — 120-Day Professional Communication Lab</title>
<meta name="description" content="Advanced 120-day communication practice for workplace and law-firm professionals.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">S</div><div><b>SpeakUp</b><small>120-Day Communication Lab</small></div></div>
  <nav>
    <button class="nav active" data-view="today">⌂ <span>Today</span></button>
    <button class="nav" data-view="journey">◫ <span>120-Day Journey</span></button>
    <button class="nav" data-view="history">◷ <span>Daily Progress</span></button>
    <button class="nav" data-view="speaking">◉ <span>Speaking Lab</span></button>
    <button class="nav" data-view="vocabulary">Aa <span>Advanced Vocabulary</span></button>
    <button class="nav" data-view="workplace">▤ <span>Workplace & Law Firm</span></button>
    <button class="nav" data-view="reading">▤ <span>Novel Reading Studio</span></button>
    <button class="nav" data-view="writing">✎ <span>Writing & Proofreading</span></button>
    <button class="nav" data-view="typing">⌨ <span>Typing Lab</span></button>
    <button class="nav" data-view="networking">◎ <span>Networking</span></button>
    <button class="nav" data-view="confidence">✦ <span>Confidence & Presence</span></button>
    <button class="nav" data-view="library">☰ <span>Guides & Blogs</span></button>
  </nav>
  <div class="sidebar-foot">
    <button class="nav" data-view="notes">▱ <span>Side Notes</span></button>
    <button class="nav" data-view="settings">⚙ <span>Settings & Data</span></button>
    <div class="streak"><b id="streakSide">0</b><span>day streak</span></div>
  </div>
</aside>

<main class="main">
<header class="topbar"><button class="hamb" id="hamb">☰</button><strong id="crumb">Today</strong><div class="topright"><button class="topbtn" id="notesBtn">＋ Notes</button><span id="dateNow"></span></div></header>
<section id="app"></section>
</main>

<aside class="notes-rail" id="notesRail">
  <div class="rail-head"><div><b>Side Notes</b><small>Stays available while you practise</small></div><button id="closeNotes">×</button></div>
  <textarea id="sideNotes" placeholder="Save useful phrases, corrections, vocabulary, reminders, ideas..."></textarea>
  <div class="saved">Auto-saved on this device</div>
</aside>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
